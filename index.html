<!doctype html>
<html lang="en">

    <!-- Viewport -->

    <!-- Primary Meta Tags -->
    <title>Six Degrees of Kevin Bacon - Movie Connection Game</title>

      name="title"
      content="Six Degrees of Kevin Bacon - Movie Connection Game"
    />

      name="description"
      content="Connect any actor to Kevin Bacon through movies! A fun browser game that finds the shortest path using real movie data from TMDB."

      name="keywords"
      content="kevin bacon, six degrees, movie game, actor connections, tmdb"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />

      property="og:title"

      content="Connect any actor to Kevin Bacon through movies! Find the shortest path using real movie data."

      content="Six Degrees of Kevin Bacon - Movie Connection Game"
    />
